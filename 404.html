<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | FAFO</title>
  <link rel="stylesheet" href="styles/style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(1200px 600px at 50% 50%, rgba(3,8,16,0.92), rgba(3,8,16,0.98));
      color: #7fffe0;
      font-family: 'Orbitron', system-ui, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 4rem;
      color: #ff4f7d;
      text-shadow: 0 0 20px #ff4f7d;
    }
    p {
      font-size: 1.3rem;
      margin: 1rem 0;
      color: #e6b800;
    }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.8rem 1.4rem;
      background: linear-gradient(135deg, #7fffe0, #00c2a8);
      color: #0d0d1a;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(0,245,212,0.4);
      transition: transform 0.2s ease;
    }
    a:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Looks like you’ve wandered off the grid…</p>
  <p>The page you’re looking for doesn’t exist.</p>
  <a href="index.html">Return to FAFO</a>
</body>
</html>
